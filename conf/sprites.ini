[img00]
; Tests color-key transparency.
; Exact-color textures such as TGAs work more reliably than lossy JPGs.
img=DeepField_Figures_NASAAstronaut_NASA_PUBD
colorkey=0x000000

init_1=blendmode = 4;

; Continuous rotation
code_1=rot = time * 0.27;

; Slow pulsing scale
code_2=new_scale = 0.45 + 0.1 * sin(time * 0.6);
code_3=sx = new_scale;
code_4=sy = new_scale;

; Pulsing red and alpha modulation
code_5=r = 0.5 + sin(time * 0.9);
code_6=a = 0.5 + sin(time * 1.3);

[img01]
; Tests the done function while drifting a mandala across the screen.
img=Mandala1

; Initialize blend mode and starting position
init_1=blendmode = 4;
init_2=x = 1;
init_3=orig_y = 0.1;

; Reset when the sprite moves past the left edge
code_1=time_to_reset = below(x, -0.5);
code_2=x = x * (1-time_to_reset) + time_to_reset * (0.5 + 0.01 * rand(100) + 1);
code_3=orig_y = 0.1;

; Randomize scale after each reset
code_4=sx = sx * (1-time_to_reset) + time_to_reset * (0.25 + 0.4 * 0.01 * rand(100));
code_5=sy = sx;

; Drift left while bobbing vertically
code_6=x = x - 0.002 + 0.0033 * sin(time * 0.371);
code_7=y = orig_y + 0.12 * sin(time * 1.9);

[img02]
; Drifts a cube and burns it into the preset every frame.
img=cube11

; Initialize blend mode and starting position
init_1=blendmode = 3;
init_2=x = 1;
init_3=orig_y = 0.5;

; Reset position and size after moving left
code_1=time_to_reset = below(x, -0.5);
code_2=x = x * (1-time_to_reset) + time_to_reset * (1.5 + 0.01 * rand(100) + 1);
code_3=orig_y = orig_y * (1-time_to_reset) + time_to_reset * (0.3 + 0.4 * 0.01 * rand(100));
code_4=sx = sx * (1-time_to_reset) + time_to_reset * (0.25 + 0.4 * 0.01 * rand(100));
code_5=sy = sx;

; Drift left and bob vertically
code_6=x = x - 0.008 + 0.0033 * sin(time * 1.371);
code_7=y = orig_y + 0.12 * sin(time * 1.9);

; Finish after 120 frames and dissolve into the screen
code_8=done = above(frame, 120);
code_9=burn = 1;

[img03]
; Tests additive display with bass-reactive scale and alpha.
img=cube5

; Initialize additive blending
init_1=blendmode = 2;

; Continuous rotation
code_1=rot = time * 0.27;

; Slow pulse in both scale axes
code_2=new_scale = 1.0 + 0.1 * sin(time * 0.6);
code_3=sx = new_scale;
code_4=sy = new_scale;

; Smooth the bass-reactive alpha
code_5=new_alpha = min(0.9, max(0.2, 2 * max(bass - 0.05, bass_att) - 1.1));
code_6=a = a * 0.83 + 0.17 * new_alpha;

[img04]
; Moves an osapien across the screen and resets it periodically.
img=cube7

; Initialize source-color blending and starting position
init_1=blendmode = 3;
init_2=x = -100;
init_3=orig_y = 0.5;

; Reset position and size after moving left
code_1=time_to_reset = below(x, -0.5);
code_2=x = x * (1-time_to_reset) + time_to_reset * (1.5 + 0.01 * rand(100) + 3);
code_3=orig_y = orig_y * (1-time_to_reset) + time_to_reset * (0.3 + 0.4 * 0.01 * rand(100));

; Randomize scale after each reset
code_4=sx = sx * (1-time_to_reset) + time_to_reset * (0.25 + 0.4 * 0.01 * rand(100));
code_5=sy = sx;

; Drift left and bob vertically
code_6=x = x - 0.008 + 0.0033 * sin(time * 1.371);
code_7=y = orig_y + 0.12 * sin(time * 1.9);

[img05]
; Rotates and pulses a cube with bass-reactive alpha.
img=cube0

; Initialize source-color blending
init_1=blendmode = 3;

; Continuous rotation
code_1=rot = time * 0.27;

; Slow pulsing scale
code_2=new_scale = 0.9 + 0.2 * sin(time * 0.6);
code_3=sx = new_scale;
code_4=sy = new_scale;

; Bass-reactive alpha; full alpha is used while the fallback is disabled
code_5=new_alpha = min(0.9, max(0.2, 2 * max(bass - 0.05, bass_att) - 1.1));
code_6=a = 1;

[img06]
; Rotates a rose and reacts to treble energy.
img=rose1

; Initialize source-color blending
init_1=blendmode = 3;

; Reverse rotation
code_1=rot = -time * 0.2;

; Slow pulsing scale
code_2=new_scale = 0.7 + 0.2 * sin(time * 0.6);
code_3=sx = new_scale;
code_4=sy = new_scale;

; Treble-reactive alpha smoothing
code_5=new_alpha = 0.4 * min(0.9, max(0.2, 2 * max(treb - 0.05, treb_att) - 1.1));
code_6=a = a * 0.03 + 0.10 * new_alpha;

[img07]
; Drifts Spirale horizontally with a slow sinusoidal offset.
img=Spirale1

; Initialize color-key blending
init_1=blendmode = 4;

code_1=x = 0.5 + 0.08 + 0.033 * sin(time * 1.371);

[img08]
; Pulses Jello and moves it around the screen in a circular pattern.
img=Jello1

; Initialize color-key blending
init_1=blendmode = 4;

; Bass-reactive size with a sinusoidal pulse
code_1=new_scale = 0.5 + 0.5 / 2 + 0.1 * sin(time * 1.0) + 0.02 * bass_att;
code_2=sx = new_scale;
code_3=sy = new_scale;

; Circular screen movement
code_4=x = 0.5 + 0.008 + 0.033 * sin(time * 1.3);
code_5=y = 0.5 + 0.008 + 0.033 * cos(time * 1.3);

[img09]
; Pulses the alpha of a circular sprite.
img=cercles4

; Initialize color-key blending
init_1=blendmode = 4;

code_1=a = 0.5 + sin(time * 0.3);

[img10]
img=wave_cymatix_logo
colorkey=0x000000

init_1=blendmode = 4;
init_2=a = 0.95;

; Floating movement
code_1=x = 0.5 + 0.025 * cos(time * 0.8) + 0.012 * sin(time * 1.7);
code_2=y = 0.5 + 0.025 * sin(time * 0.8) + 0.012 * cos(time * 1.4);

; Big bass-reactive expansion
code_3=sx = 0.48 + 0.025 * sin(time * 1.5) + 0.10 * bass + 0.12 * bass_att;
code_4=sy = 0.48 + 0.025 * sin(time * 1.5) + 0.10 * bass + 0.12 * bass_att;

; Beat-driven rotation accents
code_5=rot = 0.08 * sin(time * 0.7) + 0.035 * sin(time * 1.8) + 0.12 * bass_att;

; Beat-driven brightness
code_6=a = 0.75 + 0.25 * bass_att;

; Slight beat-driven movement
code_7=x = x + 0.012 * bass_att * sin(time * 12);
code_8=y = y + 0.012 * bass_att * cos(time * 12);